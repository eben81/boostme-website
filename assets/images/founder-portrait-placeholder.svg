<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" role="img" aria-labelledby="title description">
  <title id="title">Founder portrait placeholder</title>
  <desc id="description">A neutral architectural portrait silhouette to be replaced with the real founder photograph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3344"/>
      <stop offset="1" stop-color="#07111b"/>
    </linearGradient>
    <radialGradient id="light" cx="67%" cy="26%" r="64%">
      <stop offset="0" stop-color="#4d756f" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#193345" stop-opacity=".32"/>
      <stop offset="1" stop-color="#07111b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1=".3" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#647781"/>
      <stop offset=".55" stop-color="#293e4a"/>
      <stop offset="1" stop-color="#101e28"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
