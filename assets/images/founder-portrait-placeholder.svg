  <circle cx="565" cy="367" r="132" fill="url(#figure)"/>
  <path d="M285 1200c18-312 92-515 280-515s287 205 314 515H285Z" fill="url(#figure)"/>
  <path d="M397 1200c14-259 51-394 168-515-188 0-262 203-280 515h112Z" fill="#a6d3ca" opacity=".08"/>
  <rect x="48" y="48" width="864" height="1104" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <g fill="#d6e6e4" opacity=".62" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="480" y="1070" font-size="22" font-weight="700" letter-spacing="4">FOUNDER PORTRAIT</text>
    <text x="480" y="1107" font-size="16" letter-spacing="2">TEMPORARY PLACEHOLDER</text>
